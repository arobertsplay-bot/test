
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pokemon Pocket Controller</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      background: #111827;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 14px;
    }

    #status {
      color: #60a5fa;
      margin-bottom: 22px;
      font-size: 15px;
    }

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 7px;
      background: #38bdf8;
      color: #071827;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #7dd3fc;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #test-energy {
      background: #fbbf24;
      color: #111827;
    }

    #test-energy:hover:not(:disabled) {
      background: #fcd34d;
    }

    #screen {
      display: block;
      max-width: 100%;
      width: 360px;
      height: auto;
      margin: 20px auto;
      border: 1px solid #374151;
      border-radius: 8px;
    }

    .diagnostics {
      max-width: 900px;
      margin: 30px auto;
      text-align: left;
    }

    .diagnostics h2 {
      font-size: 20px;
    }

    #log {
      background: #030712;
      color: #86efac;
      padding: 16px;
      border-radius: 8px;
      min-height: 120px;
      max-height: 400px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <h1>Pokemon Pocket Controller</h1>

  <p id="status">Loading...</p>

  <div class="controls">

    <button id="connect">
      Connect Pixel 9
    </button>

    <button id="capture" disabled>
      Capture Screen
    </button>

    <button id="analyse" disabled>
      Analyse Screen
    </button>

    <button id="monitor" disabled>
      Start Monitoring
    </button>

    <button id="stop" disabled>
      Stop
    </button>

    <button id="test-energy" disabled>
      Test Energy Attachment
    </button>

  </div>

  <h2>Pixel Screenshot</h2>

  <img
    id="screen"
    alt="Pixel 9 screenshot"
  >

  <section class="diagnostics">

    <h2>Diagnostics</h2>

    <pre id="log">Waiting...</pre>

  </section>

  <script
    type="module"
    src="./src/main.js"
  ></script>

</body>
</html>
